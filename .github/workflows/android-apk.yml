
name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android build tools
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
          sdkmanager --install "cmake;3.22.1"
          sdkmanager --install "ndk;28.2.13676358" || {
            echo "Повторная установка NDK после сбоя распаковки"
            rm -rf "$ANDROID_HOME/ndk/28.2.13676358"
            sdkmanager --uninstall "ndk;28.2.13676358" || true
            sdkmanager --install "ndk;28.2.13676358"
          }

      - name: Install Protocol Buffers dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler python3-protobuf
          protoc --version
          /usr/bin/python3 -c "import google.protobuf; print(google.protobuf.__version__)"

      - name: Build APK
        working-directory: android
        shell: bash
        run: |
          chmod +x gradlew
          set -o pipefail
          if ./gradlew assembleDebug --no-daemon --stacktrace --info 2>&1 | tee /tmp/gradle-build.log; then
            echo "Build succeeded"
          else
            status=$?
            echo "===== KOTLIN ERRORS ====="
            grep -n -E '(^e: |Unresolved reference|Overload resolution ambiguity|Type mismatch|Expecting |StreamActivity.kt|activity_stream.xml)' /tmp/gradle-build.log | tail -n 100 || true
            exit "$status"
          fi

      
      - name: Upload Kotlin error report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Gradle-build-log
          path: /tmp/gradle-build.log
          if-no-files-found: warn
          retention-days: 3
          

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Chiaki-ng-Android-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
          
